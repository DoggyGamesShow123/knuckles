<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sonic 2 - Game Gear Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}

#stage {
  position: fixed;
  inset: 0;
  background: black;
}

/* Screen alignment */
#viewport {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

  margin-left: 2.4vw;
  margin-top: -2.1vw;

  width: 34.8vw;
  aspect-ratio: 4 / 3;

  max-width: 690px;
  max-height: 517px;

  background: black;
  overflow: hidden;
  z-index: 2;
}

#emulator {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
  background: black;
}

#bezel {
  position: absolute;
  inset: 0;
  background:
    url("https://raw.githubusercontent.com/libretro/overlay-borders/master/16x9%20Collections/NyNy77%201080%20Bezel/SegaGameGear-nyny77.png")
    center center / contain no-repeat;
  pointer-events: none;
  z-index: 3;
}

@media (max-width: 900px) {
  #viewport {
    width: 48vw;
  }
}

@media (max-width: 600px) {
  #viewport {
    width: 62vw;
  }
}
</style>
</head>

<body>

<div id="stage">

  <div id="viewport">
    <iframe
      id="emulator"
      allow="autoplay; fullscreen">
    </iframe>
  </div>

  <div id="bezel"></div>

</div>

<script>
function githubToJsDelivr(url) {
  return url.replace(
    /^https:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/([^/]+)\/(.+)$/,
    "https://cdn.jsdelivr.net/gh/$1/$2@$3/$4"
  );
}

/* CHANGE THIS URL TO ANY GITHUB BLOB ROM */
const githubRom =
  "https://github.com/DoggyGamesShow123/roms1/blob/master/gamegear/Sonic%20The%20Hedgehog%202%20(World).gg";

/* Convert GitHub → jsDelivr */
const romUrl = githubToJsDelivr(githubRom);

/* Create WebRetro URL */
const webretroUrl =
  "https://doggygamesshow123.github.io/webretro/?core=genesis_plus_gx&rom=" +
  encodeURIComponent(romUrl);

/* Load emulator */
const frame = document.getElementById("emulator");
frame.src = webretroUrl;

frame.onload = () => {
  console.log("WebRetro loaded");
  console.log("ROM URL:", romUrl);
};
</script>

</body>
</html>
