<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sonic Spinball</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    background: black;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

#stage {
    position: fixed;
    inset: 0;
    background: black;
}

#viewport {
    position: absolute;
    top: 50%;
    left: 50%;
    height: 100vh;
    aspect-ratio: 4 / 3;
    transform: translate(-50%, -50%);
    overflow: hidden;
    background: black;
    z-index: 3;
}

#game {
    width: 100%;
    height: 100%;
}

#game iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}

#bezel {
    position: absolute;
    inset: 0;
    background: url("https://raw.githubusercontent.com/libretro/overlay-borders/master/16x9%20Collections/Nosh01%201440%20Plain/Sega-Genesis-16bit-Bezel-16x9-2560x1440.png")
        center / contain no-repeat;
    pointer-events: none;
    z-index: 2;
}

@media (max-aspect-ratio: 16/9) {
    #bezel {
        display: none;
    }
}
</style>
</head>

<body>

<div id="stage">

    <div id="viewport">
        <div id="game">
            <iframe
                id="webretro"
                allow="autoplay; fullscreen">
            </iframe>
        </div>
    </div>

    <div id="bezel"></div>

</div>

<script>
function githubToJsDelivr(url) {
    return url.replace(
        /^https:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/([^/]+)\/(.+)$/,
        "https://cdn.jsdelivr.net/gh/$1/$2@$3/$4"
    );
}

const githubRom =
    "https://github.com/DoggyGamesShow123/knuckles/blob/main/Sonic%20Spinball%20(U)%20%5B!%5D.gen";

const romUrl = githubToJsDelivr(githubRom);

const webretroUrl =
    "https://doggygamesshow123.github.io/webretro/?core=genesis_plus_gx&rom=" +
    encodeURIComponent(romUrl);

document.getElementById("webretro").src = webretroUrl;
</script>

</body>
</html>
